# The Ace panel's stack (v2), installed in /opt/ace by install.sh and moved
# between versions by `ace upgrade` and `ace rollback`. Every image comes
# from GHCR with the panel's version: the release copies PostgreSQL and
# Caddy there too, so one version is one known set of images. v2 has no
# MySQL and no ace-fw (ADR 0016): plugins get no databases.
#
# /opt/ace/.env holds ACE_VERSION, ACE_DOMAIN, ACE_PUBLIC_IP, ACE_TLS (acme
# or custom) and the optional settings. The secrets live in /opt/ace/secrets
# (mode 700), made on this server and never shown:
#   master_key   the panel's master key (base64, 32 bytes)
#   pg_password  PostgreSQL's password
#   api.env      ACE_PANEL_DATABASE_URL with that password
# /opt/ace/tls holds the owner's certificate for ACE_TLS=custom (cert.pem
# with its chain, and key.pem for root only); empty for acme.
name: ace

services:
  postgres:
    image: ghcr.io/kup1ng/ace-postgres:${ACE_VERSION:?set ACE_VERSION in /opt/ace/.env}
    environment:
      POSTGRES_USER: ace
      POSTGRES_DB: ace
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    volumes:
      - pg-data:/var/lib/postgresql
      - ./secrets/pg_password:/run/secrets/pg_password:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ace -d ace"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  panel-api:
    image: ghcr.io/kup1ng/ace-panel-api:${ACE_VERSION:?}
    env_file: ./secrets/api.env
    environment:
      ACE_PANEL_MASTER_KEY_FILE: /run/secrets/master_key
      ACE_PANEL_COOKIE_SECURE: "true"
      ACE_PANEL_LOG_FORMAT: json
      # The Overview's certificate alerts: the panel reads the certificate
      # Caddy serves for the domain with a TLS handshake on this network.
      ACE_PANEL_TLS_CHECK_ADDR: caddy:443
      ACE_PANEL_TLS_DOMAIN: ${ACE_DOMAIN:?set ACE_DOMAIN in /opt/ace/.env}
      ACE_PANEL_TLS_MODE: ${ACE_TLS:-acme}
    volumes:
      - ./secrets/master_key:/run/secrets/master_key:ro
      # The panel's data: the last 10 backups, and a master key a restore
      # brought, which wins over the one above. As secret as it.
      - panel-data:/var/lib/ace-panel
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  panel-web:
    image: ghcr.io/kup1ng/ace-panel-web:${ACE_VERSION:?}
    restart: unless-stopped

  # HTTPS for ACE_DOMAIN (the Caddyfile `ace` writes from .env): a Let's
  # Encrypt certificate (ACE_TLS=acme) or the owner's from ./tls (custom).
  caddy:
    image: ghcr.io/kup1ng/ace-caddy:${ACE_VERSION:?}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tls:/etc/caddy/tls:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - panel-api
      - panel-web
    restart: unless-stopped

volumes:
  pg-data:
  panel-data:
  caddy-data:
  caddy-config:
