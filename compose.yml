# The Ace panel's stack (v2), installed in /opt/ace by install.sh and moved
# between versions by `ace upgrade` and `ace rollback`. Every image comes
# from GHCR with the panel's version: the release copies PostgreSQL and
# Caddy there too, so one version is one known set of images.
# v2 has no MySQL and no ace-fw (ADR 0016): plugins get no databases.
#
# The images are in one of two states (D52.53 (4), ADR 0013), which CI
# keeps the same for all four (test/compose.sh):
#   unpinned  ghcr.io/kup1ng/<name>:${ACE_VERSION:?}, the tag ACE_VERSION in
#             .env names: development, and a release before its pin;
#   pinned    ghcr.io/kup1ng/<name>:<version>@sha256:<digest>, from
#             2.0.0-rc.1 on: scripts/pin-release.sh writes the digest the
#             panel's GitHub release recorded for each image, and the
#             version in VERSION, so a tag that moves later changes nothing.
# install.sh and `ace upgrade` refuse a stack whose images name another
# version, and a release's (x.y.z, x.y.z-rc.N) that is not pinned. They
# read each service's block-style `image:` line, so keep one per service;
# CI checks that these lines are all the images Docker resolves.
#
# /opt/ace/.env holds ACE_VERSION, ACE_DOMAIN, ACE_PUBLIC_IP, ACE_TLS (acme
# or custom), ACE_IPV6 (true or false: the network below) and the optional
# settings. The secrets live in /opt/ace/secrets
# (mode 700), made on this server and never shown:
#   master_key   the panel's master key (base64, 32 bytes)
#   pg_password  PostgreSQL's password
#   api.env      ACE_PANEL_DATABASE_URL with that password
# /opt/ace/tls holds the owner's certificate for ACE_TLS=custom (cert.pem
# with its chain, and key.pem for root only); empty for acme.
name: ace

services:
  postgres:
    image: ghcr.io/kup1ng/ace-postgres:2.0.0-rc.2@sha256:300ebd02c6d4de9ee27ad7f6855d5d21b4d3a4a5117767c1197d284c635d9736
    environment:
      POSTGRES_USER: ace
      POSTGRES_DB: ace
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    volumes:
      - pg-data:/var/lib/postgresql
      - ./secrets/pg_password:/run/secrets/pg_password:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ace -d ace"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  panel-api:
    image: ghcr.io/kup1ng/ace-panel-api:2.0.0-rc.2@sha256:07beb603ae507411b280276ad50d76b15e649ecc579021bf164c34e7e47d3774
    env_file: ./secrets/api.env
    environment:
      ACE_PANEL_MASTER_KEY_FILE: /run/secrets/master_key
      ACE_PANEL_COOKIE_SECURE: "true"
      ACE_PANEL_LOG_FORMAT: json
      # The Overview's certificate alerts: the panel reads the certificate
      # Caddy serves for the domain with a TLS handshake on this network.
      ACE_PANEL_TLS_CHECK_ADDR: caddy:443
      ACE_PANEL_TLS_DOMAIN: ${ACE_DOMAIN:?set ACE_DOMAIN in /opt/ace/.env}
      ACE_PANEL_TLS_MODE: ${ACE_TLS:-acme}
    volumes:
      - ./secrets/master_key:/run/secrets/master_key:ro
      # The panel's data: the last 10 backups, and a master key a restore
      # brought, which wins over the one above. As secret as it.
      - panel-data:/var/lib/ace-panel
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  panel-web:
    image: ghcr.io/kup1ng/ace-panel-web:2.0.0-rc.2@sha256:5e229b78a415df0a5338b9d61c85aaf68b4277f2b07955c7155ce8456d4bdf8d
    environment:
      # The sign-in page asks the API for the panel's default language from
      # the server side. It goes straight to panel-api, never through a
      # proxy: with a proxy variable and no NO_PROXY the request fails and
      # the page silently falls back to Persian. test/ace.sh keeps these.
      ACE_API_ORIGIN: http://panel-api:8080
      NO_PROXY: panel-api
      no_proxy: panel-api
    restart: unless-stopped

  # HTTPS for ACE_DOMAIN (the Caddyfile `ace` writes from .env): a Let's
  # Encrypt certificate (ACE_TLS=acme) or the owner's from ./tls (custom).
  caddy:
    image: ghcr.io/kup1ng/ace-caddy:2.0.0-rc.2@sha256:fc9cbc100585871d18d4e451cca7021785c90a7006087427ae5ceb3e4efe6424
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tls:/etc/caddy/tls:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - panel-api
      - panel-web
    restart: unless-stopped

# The stack's network, which every service is on (test/compose.sh). With
# ACE_IPV6=true in .env it has IPv6 too, so Docker NATs IPv6 clients to Caddy
# with their own address, as it does IPv4 ones; without it Docker's proxy
# carries them, and the panel sees the network's IPv4 gateway instead (one
# login rate limit and one audit address for every IPv6 client). Its IPv6
# subnet comes from Docker's own pool (Docker 27 and later: a /64 of a ULA
# /48 made from the engine's ID), so no fixed prefix can collide with
# another network. `ace` sets ACE_IPV6 from what the server can do, and
# makes the network again when its IPv6 changes (README: The stack's network).
networks:
  default:
    enable_ipv6: ${ACE_IPV6:-false}

volumes:
  pg-data:
  panel-data:
  caddy-data:
  caddy-config:
