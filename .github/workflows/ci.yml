name: CI

on:
  push:
    branches: [main, m15-install-v2]
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    name: Scripts (shellcheck, bash -n, compose config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck -x install.sh ace scripts/pin-release.sh test/ace.sh test/ace-network.sh test/ace-stubs.sh test/install.sh test/pin-release.sh test/compose.sh
      - name: Every action is pinned by its full commit SHA, with its version in a comment
        run: |
          if grep -nE '^[[:space:]-]*uses:' .github/workflows/*.yml |
            grep -vE 'uses: [A-Za-z0-9_.-]+/[A-Za-z0-9_./-]+@[0-9a-f]{40} # v[0-9]+(\.[0-9]+)*$'; then
            echo "pin the actions above by their full commit SHA, with the version in a comment" >&2
            exit 1
          fi
      - name: bash -n
        run: |
          bash -n install.sh
          bash -n ace
          bash -n scripts/pin-release.sh
          bash -n test/ace.sh
          bash -n test/ace-network.sh
          bash -n test/ace-stubs.sh
          bash -n test/install.sh
          bash -n test/pin-release.sh
          bash -n test/compose.sh
      - name: The stack's file is valid
        env:
          ACE_VERSION: 0.0.0
          ACE_DOMAIN: panel.example.test
        run: |
          mkdir -p secrets tls && touch secrets/api.env Caddyfile
          docker compose -f compose.yml config --quiet
      - name: VERSION is a version
        run: grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?' VERSION
      - name: The stack's images are all unpinned, or all pinned to VERSION by digest, and are all Docker resolves
        env:
          ACE_VERSION: 0.0.0
          ACE_DOMAIN: panel.example.test
        run: |
          args=(-f compose.yml)
          while read -r profile; do args+=(--profile "$profile"); done < <(docker compose -f compose.yml config --profiles)
          docker compose "${args[@]}" config --images >"$RUNNER_TEMP/images"
          cat "$RUNNER_TEMP/images"
          bash test/compose.sh . "$RUNNER_TEMP/images"
      - name: The stack's one network is IPv4 only, whatever ACE_IPV6 says, and only Caddy publishes ports, on IPv4 only
        env:
          ACE_VERSION: 0.0.0
          ACE_DOMAIN: panel.example.test
        run: |
          ipv6() { docker compose -f compose.yml config --no-env-resolution --format json | tr -d '[:space:]' | grep -o '"enable_ipv6":[a-z]*'; }
          [[ "$(docker compose -f compose.yml config --networks)" == default ]]
          [[ "$(ipv6)" == '"enable_ipv6":false' ]]
          [[ "$(ACE_IPV6=true ipv6)" == '"enable_ipv6":false' ]]
          ports="$(docker compose -f compose.yml config --format json |
            jq -c '[.services | to_entries[] | .key as $s | (.value.ports // [])[] | [$s, .host_ip, .published, .target, .protocol]] | sort')"
          echo "$ports"
          [[ "$ports" == '[["caddy","0.0.0.0","443",443,"tcp"],["caddy","0.0.0.0","443",443,"udp"],["caddy","0.0.0.0","80",80,"tcp"]]' ]]

  install:
    name: install.sh resolves versions (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: test/install.sh
        run: bash test/install.sh

  ace:
    name: ace upgrade, rollback, apply and certificate (against stubs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: test/ace.sh
        run: sudo CI=true bash test/ace.sh

  ace-network:
    name: ace and the stack's IPv4-only network (against stubs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: test/ace-network.sh
        run: sudo CI=true bash test/ace-network.sh

  pin:
    name: scripts/pin-release.sh (against stub gh and docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: test/pin-release.sh
        run: bash test/pin-release.sh
